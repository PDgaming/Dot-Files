map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /mnt/Programming/server/nginx-ssl/server.crt;
    ssl_certificate_key /mnt/Programming/server/nginx-ssl/server.key;
    ssl_trusted_certificate /mnt/Programming/server/nginx-ssl/ca.crt;

    root /mnt/Programming/server/homePage/build/;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /vaultwarden {
        return 301 /vaultwarden/;
    }

    location /vaultwarden/ {
        proxy_pass http://127.0.0.1:8300;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 525M;
    }

    location /emby/ {
        proxy_pass http://127.0.0.1:8096;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bluemap/ {
        proxy_pass http://127.0.0.1:8100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
}